<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9CCBF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ghisa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Ghisa – a simple gym log with rest timer and progress charts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ghisa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#9CCBF7; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#4A4A45; --label:#16324F;
  --soft:#D9EBFD; --cream:#EFF6FE; --accent:#E84A2A; --good:#2B8A50; --good-bg:#DDF1E3; --good-ink:#1A5C36;
  --bad-bg:#FCD7CF; --hair:#D3E1EF; --shade:#5A8CC0;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2{font-family:var(--f-display);margin:0;line-height:1.05}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:22px max(16px,env(safe-area-inset-left)) 24px;display:flex;flex-direction:column;gap:16px}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--label)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* header */
.brand{display:flex;flex-direction:column}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:var(--surface);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);font-family:var(--f-mono);font-size:13px;font-weight:700;white-space:nowrap}
.tag{font-family:var(--f-mono);font-weight:700;font-size:11px;border:1.5px solid var(--ink);border-radius:6px;padding:2px 6px;background:var(--soft);white-space:nowrap}
.tag.scarse{background:var(--bad-bg)}
.tag.up{background:var(--good-bg);color:var(--good-ink)}
.iconbtn{color:var(--ink);width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--surface);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);text-decoration:none}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.title-xl{font-size:44px;font-weight:800;letter-spacing:-.02em}
.title-l{font-size:28px;font-weight:800}
.title-m{font-size:22px;font-weight:800}

/* cards */
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 var(--shade)}
.hero .label{color:var(--bg)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05}
.hero .sub{color:#E6E2D3}
.btn{border:3px solid var(--ink);border-radius:16px;padding:13px 18px;font-weight:700;font-size:18px;min-height:54px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none}
.btn:active{transform:translateY(3px)}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--ink)}
.hero .btn-accent{box-shadow:0 5px 0 #fff}
.btn-ink{background:var(--ink);color:#fff;box-shadow:0 5px 0 var(--shade)}
.btn-dash{background:transparent;border:2.5px dashed var(--ink);font-size:15px;min-height:48px;box-shadow:none}
.btn-plain{background:var(--surface);font-size:15px;min-height:46px;border-width:2.5px;box-shadow:0 3px 0 var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gcard{text-align:left;background:var(--surface);border:2.5px solid var(--ink);border-bottom-width:6px;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:104px;text-decoration:none;color:inherit}
.gcard:active{border-bottom-width:3px;transform:translateY(3px)}
.gcard b{font-family:var(--f-display);font-size:20px;font-weight:800}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);flex:none}
.gnew{min-height:104px;flex-direction:column;border-radius:18px}

.list{display:flex;flex-direction:column;gap:10px}
.erow{display:flex;align-items:center;gap:12px;background:var(--cream);border:2.5px solid var(--ink);border-bottom-width:6px;border-radius:18px;padding:12px 14px;min-height:64px;text-decoration:none;color:inherit}
.erow.done{background:var(--surface)}
.erow:active{border-bottom-width:3px;transform:translateY(3px)}
.tick{width:34px;height:34px;flex:none;border:2.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.erow.done .tick{background:var(--good)}
.ename{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.15}
.esub{font-size:13px;color:var(--muted)}
.eval{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;font-family:var(--f-mono)}
.eval b{font-size:16px}
.eval span{font-size:13px;color:var(--muted)}
.bar{flex:1;height:16px;background:var(--surface);border:2.5px solid var(--ink);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}

/* log card */
.logcard{background:var(--surface);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:58px;height:58px;flex:none;border:2.5px solid var(--ink);border-bottom-width:5px;border-radius:16px;background:var(--bg);display:grid;place-items:center}
.step button:active{border-bottom-width:2.5px;transform:translateY(2px)}
.step input{flex:1;min-width:0;width:100%;text-align:center;font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;border:0;background:transparent;padding:0;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font-family:var(--f-display);font-weight:800;font-size:18px;margin-left:-6px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{border:2.5px solid var(--ink);border-radius:14px;padding:10px;background:var(--surface);font-weight:700;font-size:15px;min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--soft);box-shadow:inset 0 0 0 2px var(--ink)}
.seg button.sc[aria-pressed="true"]{background:var(--bad-bg)}

.panel{background:var(--surface);border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1.5px solid var(--hair);font-size:14px}
.prow:last-child{border-bottom:0}
.prow .x{width:36px;height:36px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;margin:-6px -8px -6px 0}
.phead{padding:8px 14px;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.chart{background:var(--surface);border:2.5px solid var(--ink);border-radius:18px;padding:14px 12px 10px;display:flex;align-items:flex-end;gap:6px;height:140px}
.chart .c{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.chart .c i{display:block;width:100%;background:var(--soft);border:2px solid var(--ink);border-radius:6px 6px 2px 2px}
.chart .c:last-child i{background:var(--bg)}
.chart .c span{font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.chart .c span.d{color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--cream);border:2.5px dashed var(--ink);border-radius:18px}

textarea{width:100%;min-height:220px;resize:vertical;border:3px solid var(--ink);border-radius:18px;padding:14px;font-family:var(--f-mono);font-size:13px;line-height:1.6;background:#FFFDF2;box-shadow:0 5px 0 var(--ink)}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px}
.field input{border:0;background:transparent;font-family:var(--f-mono);font-weight:700;font-size:15px;flex:1;min-width:0}
.warn{display:flex;gap:8px;align-items:flex-start;padding:9px 14px;font-size:13px;background:#FFF4E0}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links button{flex:1 1 140px}

nav{position:sticky;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:3px solid var(--ink);z-index:5}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--ink);font-weight:700;font-size:13px;min-width:72px;padding:6px 10px;border:2px solid transparent;border-radius:12px}
nav a[aria-current="page"]{background:var(--bg);border-color:var(--ink)}
.sticky-foot{position:sticky;bottom:0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:var(--surface);border-top:3px solid var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;transition:.2s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
/* progressi */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:2.5px solid var(--ink);border-radius:999px;padding:8px 14px;background:var(--surface);font-weight:700;font-size:14px;min-height:40px}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pseg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:2.5px solid var(--ink);border-radius:14px;padding:3px;gap:3px}
.pseg button{border:0;border-radius:10px;background:transparent;font-weight:700;font-size:15px;min-height:40px}
.pseg button[aria-pressed="true"]{background:var(--bg);box-shadow:inset 0 0 0 2px var(--ink)}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sumrow div{display:flex;flex-direction:column;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px}
.sumrow b{font-family:var(--f-display);font-size:30px;line-height:1}
.sumrow span{font-size:13px;color:#E6E2D3}
.pcard{background:var(--surface);border:2.5px solid var(--ink);border-bottom-width:6px;border-radius:18px;overflow:hidden}
.phead-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:transparent;min-height:72px}
.spark-wrap{width:120px;flex:none}
.spark{display:block;width:120px;height:40px}
.pbody{padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px;border-top:2px solid var(--hair)}
.big{display:block;width:100%;height:auto;margin-top:10px}
.ax{font-family:var(--f-mono);font-size:10px;fill:#4A4A45}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--ink);display:inline-block}
.lg-dot.hollow{background:#fff}
.lg-dash{width:18px;border-top:2px dashed var(--accent);display:inline-block}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stats div{display:flex;flex-direction:column;background:var(--cream);border:2px solid var(--ink);border-radius:12px;padding:6px 8px}
.stats span{font-size:11px;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:15px}
/* timer */
.timer{background:var(--surface);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:14px}
.timer.done{background:var(--good-bg)}
.tauto{border:2px solid var(--ink);border-radius:999px;background:var(--surface);font-weight:700;font-size:13px;padding:6px 12px;min-height:36px;display:inline-flex;align-items:center;gap:5px}
.tauto[aria-pressed="true"]{background:var(--soft)}
.tring{position:relative;width:184px;height:184px;margin:0 auto}
.tring svg{width:100%;height:100%;display:block}
.tring circle{transition:stroke-dashoffset .25s linear}
.tcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tdisp{font-family:var(--f-display);font-weight:800;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.tdur{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tdur button{border:2.5px solid var(--ink);border-bottom-width:5px;border-radius:14px;background:var(--bg);font-family:var(--f-display);font-weight:800;font-size:20px;min-height:56px}
.tdur button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tdur button:active{border-bottom-width:2.5px;transform:translateY(2px)}
.tctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tpill{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:8;background:var(--ink);color:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:8px 14px;font-family:var(--f-mono);font-weight:700;font-size:14px;box-shadow:0 3px 0 var(--shade)}
.tpill[hidden]{display:none}
.lgrp{display:flex;flex-direction:column;gap:4px}
.lgname{display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:800;font-size:18px}
.lgname .dot{width:10px;height:10px}
.hero ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hero li{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:15px}
.hero li:last-child{border-bottom:0}
.hero .ln{flex:1;min-width:0;color:#F2EFE4}
.hero .lk{font-family:var(--f-mono);font-weight:700;color:var(--bg);white-space:nowrap}
.hero .lr{font-family:var(--f-mono);font-size:13px;color:#C9C4B4;width:40px;text-align:right;white-space:nowrap}
/* palette */
:root[data-pal="menta"]{--bg:#8FD9B6;--soft:#D3F2E3;--cream:#EEFAF4;--accent:#E2462B;--shade:#4E9F7C;--label:#17402E;--hair:#CFE6DA}
:root[data-pal="giallo"]{--bg:#F5D130;--soft:#FCEFB4;--cream:#FFF8DA;--accent:#E2462B;--shade:#B8960F;--label:#3D3510;--hair:#E4DCC0}
:root[data-pal="cielo"]{--bg:#9CCBF7;--soft:#D9EBFD;--cream:#EFF6FE;--accent:#E84A2A;--shade:#5A8CC0;--label:#16324F;--hair:#D3E1EF}
:root[data-pal="pesca"]{--bg:#F7A8B8;--soft:#FCDCE3;--cream:#FEF0F3;--accent:#2B4FD8;--shade:#C26E80;--label:#4A1F29;--hair:#F0D4DA}
:root[data-pal="lavanda"]{--bg:#C3B1F5;--soft:#E6DDFC;--cream:#F5F1FE;--accent:#E2462B;--shade:#8670C9;--label:#2E2257;--hair:#E0D8F5}
:root[data-pal="arancio"]{--bg:#FF9A4D;--soft:#FFE0C7;--cream:#FFF3E8;--accent:#2B4FD8;--shade:#C46A24;--label:#4A2508;--hair:#F2DCC8}
:root[data-pal="carta"]{--bg:#EDE6D6;--soft:#F5EDD8;--cream:#FBF8F0;--accent:#E2462B;--shade:#B3A88E;--label:#4A4232;--hair:#E3DACA}
.pals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pal{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:2.5px solid var(--ink);border-radius:16px;padding:10px;box-shadow:0 4px 0 var(--ink)}
.pal[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px}
.sw{position:relative;height:58px;border-radius:10px;border:2.5px solid var(--ink);display:flex;align-items:center;padding:0 12px;overflow:hidden}
.sw b{font-family:var(--f-display);font-size:22px;color:#1A1A1A;position:relative}
.sw i{position:absolute;right:0;top:0;bottom:0;width:34%;border-left:2.5px solid var(--ink)}
.pal span{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
/* mascotte */
.bell{display:block;overflow:visible}
.bellwrap{position:relative;display:flex;flex-direction:column;align-items:flex-end;flex:none}
.bubble{background:#fff;border:2.5px solid var(--ink);border-radius:12px 12px 2px 12px;padding:5px 10px;font-family:var(--f-display);font-weight:800;font-size:14px;line-height:1.15;white-space:nowrap;margin-bottom:2px;margin-right:34px;box-shadow:0 2px 0 var(--ink)}
.bellwrap.home .bell{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.bellwrap .bell-go,.bellwrap .bell-flex{animation:hop .6s ease-out 1}
.bellwrap .bell-rest{animation:breathe 2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3px) rotate(-3deg)}75%{transform:translateY(-3px) rotate(3deg)}}
@keyframes hop{0%{transform:translateY(14px) scale(.92)}60%{transform:translateY(-8px)}100%{transform:none}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
.tstage{position:relative;display:flex;justify-content:center}
.tstage .bellwrap{position:absolute;right:-8px;bottom:-6px}
.tstage .bubble{position:absolute;bottom:100%;right:0;margin:0 0 4px;white-space:normal;width:max-content;max-width:82px;text-align:right;font-size:12px;padding:4px 8px}
.empty .bellwrap{align-items:center;margin:0 auto 6px}
@media (max-width:360px){.bubble{font-size:12px}}
@media (prefers-reduced-motion:reduce){.bell{animation:none!important}}
.swipe-ind{position:fixed;left:0;top:50%;transform:translate(-56px,-50%);width:44px;height:44px;border-radius:50%;background:var(--surface);border:2.5px solid var(--ink);display:grid;place-items:center;z-index:20;transition:transform .15s ease-out,background .15s;pointer-events:none}
.swipe-ind.ready{background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<button class="tpill" id="tpill" hidden>Rest</button>
<script>
(function(){
"use strict";
var KEY = "ghisa-v1";
var COLORS = ["#E2462B","#3B6FE0","#2B9A5B","#9B4FD1","#F08A1C","#E0457B","#1FA3A3","#7A5A00"];
var SEED2 = "SPALLE\nCavo - 4kg - 16\nLateral raise manubri — 12kg - 8 scarse\n\nBICIPITI\nHummer curl - 18kg - 5\n\nPETTO\nChest inclined - 20kg - 9\nGAMBE\nHip trust dischi - 35kg - 10";
var SEED = "SPALLE\nMilitarypress — 9kg - 7\nCavo - 4kg - 16\nLateral raise manubri — 12kg - 8 scarse\nMacchina - 50kg - 7\n\nBICIPITI\nBilanciere curl — 6kg - 6\nHummer curl - 18kg - 5\nPanca Scott — 11kg - 8 scarse\nIncline dumbbell curl — 10KG - 10\n\nPETTO\nPanca piana- 22,5 kg - 4\nChest press - 27,5kg - 12\nChest inclined - 20kg - 9\nPanca inclined - 17,5kg - 5\nPec dek - 45kg-12\n\nTRICIPITI\nClose grip bench press - 18kg - 8\nCable overhead triceps extension -18kg - 12\nCable triceps pushdown (basso) — 18kg - 17\n\nGAMBE\nSquat - 15kg - 10\nHip trust macchina cavo - 80kg - 10\nHip trust dischi - 35kg - 10";

/* ---------- dati ---------- */
function uid(){ return Math.random().toString(36).slice(2,10); }
function iso(d){ var z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function today(){ return iso(new Date()); }
function daysAgo(n){ var d = new Date(); d.setDate(d.getDate()-n); return iso(d); }
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,""); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmtKg(n){ return (Math.round(n*100)/100).toString(); }
function cap(s){ s = s.trim(); return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }

}

  return null;
}
function findGroup(id){ for (var i=0;i<S.groups.length;i++) if (S.groups[i].id===id) return S.groups[i]; return null; }
function logsOf(exId){ return S.logs.filter(function(l){return l.exId===exId;}).sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:a.t-b.t; }); }
function lastDateOfGroup(g){
  var ids = {}; g.exercises.forEach(function(e){ids[e.id]=1;});
  var d = null; S.logs.forEach(function(l){ if (ids[l.exId] && (!d || l.date>d)) d=l.date; }); return d;
}
function rel(date){
  if (!date) return "never";
  var a = new Date(date+"T00:00:00"), b = new Date(today()+"T00:00:00");
  var n = Math.round((b-a)/86400000);
  if (n<=0) return "today"; if (n===1) return "yesterday"; if (n<7) return n+"d ago";
  return shortDate(date);
}
var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function shortDate(date){ var d = new Date(date+"T00:00:00"); return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3); }
function dayLabel(date){ var d = new Date(date+"T00:00:00"); return DAYS[d.getDay()].slice(0,3)+" "+shortDate(date); }
function longDay(date){ var d = new Date(date+"T00:00:00"); return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; }

/* ---------- lettura del blocco note ---------- */
var LINE = /^(.+?)\s*[—–\-]+\s*(\d+(?:[.,]\d+)?)\s*(?:kg)?\s*[—–\-x×]*\s*(\d+)\s*(.*)$/i;
function parseNote(text){
  var out = [], cur = null, bad = [];
  text.split(/\r?\n/).forEach(function(raw){
    var line = raw.trim(); if (!line) return;
    var m = line.match(LINE);
    if (m){
      if (!cur){ cur = {name:"No group", items:[]}; out.push(cur); }
      cur.items.push({ name:m[1].trim(), kg:parseFloat(m[2].replace(",",".")), reps:parseInt(m[3],10), scarse:/scars|barely|struggl/i.test(m[4]) });
    } else if (!/\d/.test(line) && /[a-zà-ú]/i.test(line) && line===line.toUpperCase()){
      cur = { name:cap(line.replace(/:$/,"")), items:[] }; out.push(cur);
    } else bad.push(line);
  });
  out = out.filter(function(g){return g.items.length;});
  out.bad = bad; return out;
}
function applyImport(state, parsed, date){
  var renamed = [], t = Date.now();
  parsed.forEach(function(pg){
    var g = state.groups.filter(function(x){return norm(x.name)===norm(pg.name);})[0];
    if (!g){ g = {id:uid(), name:pg.name, color:COLORS[state.groups.length%COLORS.length], exercises:[]}; state.groups.push(g); }
    pg.items.forEach(function(it){
      var ex = g.exercises.filter(function(e){return norm(e.name)===norm(it.name);})[0];
      if (ex && ex.name!==it.name) renamed.push([it.name, ex.name]);
      if (!ex){ ex = {id:uid(), name:it.name}; g.exercises.push(ex); }
      state.logs.push({id:uid(), exId:ex.id, date:date, kg:it.kg, reps:it.reps, scarse:it.scarse, t:t++});
    });
  });
  return renamed;
}

var T = { dur:90, auto:true, running:false, end:0, left:null, total:90000, done:false };

if ([60,120,180].indexOf(T.dur)<0) T.dur = 60;
function tSave(){ try { localStorage.setItem("ghisa-timer", JSON.stringify({dur:T.dur, auto:T.auto})); } catch(e){} }
var actx = null, wake = null;
function unlockAudio(){ try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if (actx.state==="suspended") actx.resume(); } catch(e){} }
function beep(){
  if (!actx) return;
  [0,0.28,0.56].forEach(function(t0,i){
    var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime+t0;
    o.type="square"; o.frequency.value = i===2 ? 1320 : 880;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.24);
  });
}
function askWake(){ try { if (navigator.wakeLock && !wake) navigator.wakeLock.request("screen").then(function(w){ wake=w; w.addEventListener("release",function(){wake=null;}); }).catch(function(){}); } catch(e){} }
function releaseWake(){ try { if (wake) wake.release(); } catch(e){} wake=null; }
function timerStart(sec, resume){
  unlockAudio();
  if (!resume) T.total = sec*1000;
  if (curExId()) T.ex = curExId();
  T.end = Date.now()+sec*1000; T.left = null; T.running = true; T.done = false; askWake();
}
function timerStop(){ T.running=false; T.left=null; T.done=false; releaseWake(); tick(); }
function fmtT(ms){ var sTot = Math.max(0, Math.ceil(ms/1000)); return Math.floor(sTot/60)+":"+String(sTot%60).padStart(2,"0"); }
function tRemaining(){ return T.running ? T.end-Date.now() : (T.left!=null ? T.left : T.dur*1000); }
var RING = 2*Math.PI*84;
function timerHtml(){
  var rem = tRemaining(), frac = (T.running||T.left!=null) ? Math.max(0,Math.min(1,rem/T.total)) : 1;
  var state = T.done ? "Done" : T.running ? "Running" : T.left!=null ? "Paused" : "Ready";
  var opts = [[60,"1 min"],[120,"2 min"],[180,"3 min"]].map(function(o){
    return '<button data-act="tset" data-v="'+o[0]+'" aria-pressed="'+(T.dur===o[0])+'">'+o[1]+'</button>'; }).join("");
  var active = T.running || T.left!=null;
  return '<section class="timer'+(T.done?" done":"")+'" aria-label="Rest timer">'+
    '<div class="row between"><h2 class="title-m">Rest</h2><button class="tauto" data-act="tauto" aria-pressed="'+T.auto+'">'+(T.auto?I.checkInk:"")+'Auto-start on Save</button></div>'+
    '<div class="tstage"><div class="tring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="84" fill="none" style="stroke:var(--soft)" stroke-width="16"/>'+
      '<circle id="tarc" cx="100" cy="100" r="84" fill="none" stroke="'+(T.done?"#2B8A50":"#1A1A1A")+'" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+RING.toFixed(1)+'" stroke-dashoffset="'+(RING*(1-frac)).toFixed(1)+'" transform="rotate(-90 100 100)"/></svg>'+
      '<div class="tcenter"><span id="tdisp" class="tdisp" role="timer" aria-live="off">'+(T.done?"Go!":fmtT(rem))+'</span><span id="tstate" class="label" style="color:var(--muted)">'+state+'</span></div></div>'+
      (T.done ? bellSay("go",64,"Go! Next set") : T.running ? bellSay("rest",64,"Breathe…") : T.left!=null ? bellSay("sleep",64,"Paused") : bellSay("hi",64,"Rest between sets"))+'</div>'+
    '<div class="tdur" role="group" aria-label="Duration">'+opts+'</div>'+
    (active ? '<div class="tctl"><button class="btn btn-plain" data-act="tpause">'+(T.running?"Pause":"Resume")+'</button><button class="btn btn-plain" data-act="tadd">+15 s</button><button class="btn btn-plain" data-act="tstop">Stop</button></div>'
            : '<p class="muted" style="margin:0;font-size:14px;text-align:center">Tap 1, 2 or 3 min to start your rest.</p>')+
    '</section>';
}
function tick(){
  var pill = document.getElementById("tpill");
  if (T.running && tRemaining()<=0){
    T.running=false; T.left=null; T.done=true; releaseWake();
    try { navigator.vibrate && navigator.vibrate([300,150,300,150,500]); } catch(e){}
    beep(); toast("Rest over · next set!");
    if (document.getElementById("tdisp")) rerender(true);
    setTimeout(function(){ if (T.done){ T.done=false; if (document.getElementById("tdisp")) rerender(true); else tick(); } }, 8000);
  }
  var rem = tRemaining(), d = document.getElementById("tdisp"), arc = document.getElementById("tarc");
  if (d && !T.done) d.textContent = fmtT(rem);
  if (arc && (T.running||T.left!=null)) arc.setAttribute("stroke-dashoffset", (RING*(1-Math.max(0,Math.min(1,rem/T.total)))).toFixed(1));
  if (pill){
    var show = (T.running || T.done) && !d;
    pill.hidden = !show;
    if (show) pill.innerHTML = T.done ? "Rest over" : "Rest "+fmtT(rem);
  }
}
setInterval(tick, 250);
document.getElementById("tpill").addEventListener("click", function(){ if (T.ex && findEx(T.ex)) location.hash = "#/e/"+T.ex; });
document.addEventListener("visibilitychange", function(){ if (!document.hidden){ tick(); if (T.running) askWake(); } });

/* ---------- progressi (sola lettura) ---------- */
var P = { g:"all", m:"1rm", r:"all", open:null };
var METRICS = {
  "1rm": { label:"Strength", unit:"kg", info:"Estimated 1-rep max from weight and reps: it goes up even when you only add reps." },
  "kg":  { label:"Weight", unit:"kg", info:"The heaviest load you used in each workout." },
  "vol": { label:"Volume", unit:"kg", info:"Weight × reps, added up over every set of the workout." }
};
var RANGES = { "1m":["1 month",31], "3m":["3 months",92], "all":["All time",0] };
function series(exId, m, r){
  var from = RANGES[r][1] ? daysAgo(RANGES[r][1]) : "";
  var by = {};
  logsOf(exId).forEach(function(l){
    if (l.date < from) return;
    var o = by[l.date] || (by[l.date] = {date:l.date, v:0, scarse:false, sets:[]});
    var val = m==="kg" ? l.kg : m==="vol" ? l.kg*l.reps : (l.reps ? l.kg*(1+l.reps/30) : l.kg);
    o.v = m==="vol" ? o.v+val : Math.max(o.v, val);
    if (l.scarse) o.scarse = true;
    o.sets.push(l);
  });
  return Object.keys(by).sort().map(function(d){ return by[d]; });
}
function dnum(d){ return new Date(d+"T00:00:00").getTime()/86400000; }
function fmtV(v){ return v>=1000 ? (Math.round(v/100)/10).toString()+"k" : fmtKg(Math.round(v*2)/2); }
function trendOf(s){
  if (s.length<2) return {pct:0, kind:"one"};
  var a = s[0].v, b = s[s.length-1].v, pct = a ? (b-a)/a*100 : 0;
  return {pct:pct, kind: pct>=2 ? "up" : pct<=-2 ? "down" : "flat"};
}
function trendTag(t){
  if (t.kind==="one") return '<span class="tag">1 workout</span>';
  var n = Math.round(Math.abs(t.pct));
  if (t.kind==="up") return '<span class="tag up">↑ '+n+'%</span>';
  if (t.kind==="down") return '<span class="tag scarse">↓ '+n+'%</span>';
  return '<span class="tag">= steady</span>';
}
function spark(s){
  var W=120, H=40, pad=4;
  if (!s.length) return '';
  if (s.length===1) return '<svg viewBox="0 0 '+W+' '+H+'" class="spark" aria-hidden="true"><circle cx="'+(W-pad-2)+'" cy="'+H/2+'" r="4" fill="#1A1A1A"/></svg>';
  var x0=dnum(s[0].date), x1=dnum(s[s.length-1].date)||x0+1, vs=s.map(function(p){return p.v;}), mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  if (mx===mn){ mx+=1; mn-=1; }
  var pts = s.map(function(p){ return [pad+(dnum(p.date)-x0)/((x1-x0)||1)*(W-2*pad), H-pad-(p.v-mn)/(mx-mn)*(H-2*pad)]; });
  var line = pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ");
  var last = pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" class="spark" aria-hidden="true"><polygon points="'+pad+','+(H-pad)+' '+line+' '+last[0].toFixed(1)+','+(H-pad)+'" style="fill:var(--soft)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4" style="fill:var(--accent)" stroke="#1A1A1A" stroke-width="2"/></svg>';
}
function bigChart(s, unit){
  var W=320, H=180, L=40, R=12, T=14, B=26;
  if (s.length<2) return '<div class="empty" style="padding:16px">The chart shows up after your second workout.</div>';
  var x0=dnum(s[0].date), x1=dnum(s[s.length-1].date), vs=s.map(function(p){return p.v;}), mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  var span = (mx-mn) || mx*0.1 || 1; mn = Math.max(0, mn-span*0.25); mx = mx+span*0.25;
  function X(d){ return L+(dnum(d)-x0)/((x1-x0)||1)*(W-L-R); }
  function Y(v){ return T+(1-(v-mn)/(mx-mn))*(H-T-B); }
  var g = "";
  for (var i=0;i<3;i++){ var v = mn+(mx-mn)*(i+0.5)/3, y=Y(v);
    g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#E4DCC0" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" class="ax">'+fmtV(v)+'</text>'; }
  /* linea di tendenza (regressione lineare) */
  var n=s.length, sx=0, sy=0, sxx=0, sxy=0;
  s.forEach(function(p){ var x=dnum(p.date)-x0; sx+=x; sy+=p.v; sxx+=x*x; sxy+=x*p.v; });
  var den = n*sxx-sx*sx, k = den ? (n*sxy-sx*sy)/den : 0, q = (sy-k*sx)/n;
  var trend = '<line x1="'+L+'" y1="'+Y(q).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(q+k*(x1-x0)).toFixed(1)+'" style="stroke:var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>';
  var line = s.map(function(p){return X(p.date).toFixed(1)+","+Y(p.v).toFixed(1);}).join(" ");
  var area = '<polygon points="'+L+','+(H-B)+' '+line+' '+(W-R)+','+(H-B)+'" style="fill:var(--soft)"/>';
  var dots = s.map(function(p){ return '<circle cx="'+X(p.date).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4.5" fill="'+(p.scarse?"#FFFFFF":"#1A1A1A")+'" stroke="#1A1A1A" stroke-width="2"/>'; }).join("");
  function dl(d){ return shortDate(d); }
  var xl = '<text x="'+L+'" y="'+(H-8)+'" class="ax">'+dl(s[0].date)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" class="ax">'+dl(s[n-1].date)+'</text>';
  if (n>2){ var mid = s[Math.floor(n/2)]; xl += '<text x="'+X(mid.date).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" class="ax">'+dl(mid.date)+'</text>'; }
  var perWeek = k*7, wk = Math.abs(perWeek)<0.05 ? "steady" : (perWeek>0?"+":"−")+fmtV(Math.abs(perWeek))+" "+unit+" per week";
  return '<svg viewBox="0 0 '+W+' '+H+'" class="big" role="img" aria-label="Progress over time">'+g+area+trend+'<polyline points="'+line+'" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+dots+xl+'</svg>'+
    '<div class="legend"><span><i class="lg-dot"></i>workout</span><span><i class="lg-dot hollow"></i>barely</span><span><i class="lg-dash"></i>trend: '+wk+'</span></div>';
}
function vProg(){
  var meta = METRICS[P.m];
  function seg(act, cur, opts){ return '<div class="pseg" role="group">'+opts.map(function(o){ return '<button data-act="'+act+'" data-v="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+o[1]+'</button>'; }).join("")+'</div>'; }
  var groups = P.g==="all" ? S.groups : S.groups.filter(function(g){return g.id===P.g;});
  var items = [];
  groups.forEach(function(g){ g.exercises.forEach(function(ex){ var s = series(ex.id, P.m, P.r); if (s.length) items.push({g:g, ex:ex, s:s, t:trendOf(s)}); }); });
  items.sort(function(a,b){ var ka=a.t.kind==="one"?-1e9:a.t.pct, kb=b.t.kind==="one"?-1e9:b.t.pct; return kb-ka; });
  var up = items.filter(function(i){return i.t.kind==="up";}).length, down = items.filter(function(i){return i.t.kind==="down";}).length, flat = items.filter(function(i){return i.t.kind==="flat";}).length;
  var top = items.filter(function(i){return i.t.kind==="up";})[0];
  var multi = items.some(function(i){return i.t.kind!=="one";});
  var summary = multi ? '<section class="hero" style="gap:10px"><span class="label">'+esc(RANGES[P.r][0])+' · '+esc(meta.label.toLowerCase())+'</span>'+
    '<div class="sumrow"><div><b>'+up+'</b><span>improving</span></div><div><b>'+flat+'</b><span>steady</span></div><div><b>'+down+'</b><span>dropping</span></div></div>'+
    (top?'<div class="sub">Most improved: <b style="color:#fff">'+esc(top.ex.name)+'</b> · +'+Math.round(top.t.pct)+'%</div>':'')+'</section>' : '';
  var cards = items.map(function(it){
    var open = P.open===it.ex.id, s=it.s, last=s[s.length-1], best=s.reduce(function(a,p){return p.v>a.v?p:a;}, s[0]);
    var body = "";
    if (open){
      var recent = s.slice(-5).reverse().map(function(p){
        return '<div class="prow"><span class="muted" style="width:76px;flex:none">'+esc(dayLabel(p.date))+'</span><span class="grow mono" style="font-weight:700">'+p.sets.map(function(l){return fmtKg(l.kg)+'×'+l.reps;}).join("  ")+'</span>'+(p.scarse?'<span class="tag scarse">barely</span>':'')+'</div>';
      }).join("");
      body = '<div class="pbody">'+bigChart(s, meta.unit)+
        '<div class="stats"><div><span>Start</span><b>'+fmtV(s[0].v)+'</b></div><div><span>Best</span><b>'+fmtV(best.v)+'</b></div><div><span>Latest</span><b>'+fmtV(last.v)+'</b></div><div><span>Workouts</span><b>'+s.length+'</b></div></div>'+
        '<div class="panel" style="border-width:2px"><div class="phead">Recent sessions</div>'+recent+'</div></div>';
    }
    return '<section class="pcard'+(open?" open":"")+'"><button class="phead-btn" data-act="popen" data-id="'+it.ex.id+'" aria-expanded="'+open+'">'+
      '<span class="grow" style="display:flex;flex-direction:column;gap:3px;text-align:left"><span class="row" style="gap:7px"><span class="dot" style="width:10px;height:10px;background:'+it.g.color+'"></span><span class="label" style="color:var(--muted)">'+esc(it.g.name)+'</span></span>'+
      '<span class="ename">'+esc(it.ex.name)+'</span><span class="row" style="gap:6px">'+trendTag(it.t)+'<span class="mono muted" style="font-size:12px">now '+fmtV(last.v)+' '+meta.unit+'</span></span></span>'+
      '<span class="spark-wrap">'+spark(s)+'</span></button>'+body+'</section>';
  }).join("");
  var chips = '<div class="chips">'+[["all","All"]].concat(S.groups.map(function(g){return [g.id,g.name];})).map(function(o){
    return '<button data-act="pg" data-v="'+o[0]+'" aria-pressed="'+(P.g===o[0])+'">'+esc(o[1])+'</button>'; }).join("")+'</div>';
  var pm = !items.length ? bellSay("sleep",72,"No data yet…") : up>down ? bellSay("flex",72,"Getting stronger!") : bellSay("think",72,"Keep pushing!");
  return '<main><div class="row between" style="align-items:flex-end"><div class="grow"><span class="label">Read only</span><h1 class="title-xl">Progress</h1></div>'+pm+'</div>'+
    chips+seg("pm", P.m, [["1rm","Strength"],["kg","Weight"],["vol","Volume"]])+
    '<p class="muted" style="margin:-6px 2px 0;font-size:14px">'+esc(meta.info)+'</p>'+
    seg("pr", P.r, [["1m","1 month"],["3m","3 months"],["all","All time"]])+summary+
    (cards ? '<div class="list" style="gap:12px">'+cards+'</div>' : '<div class="empty">'+bellSay("sleep",70,"")+'No workouts in this period.</div>')+
    '</main>'+navBar("prog");
}

    '<div style="margin-top:12px"><h2 class="title-m">Backup</h2><p class="muted" style="margin:6px 0 10px;font-size:14px">Your data lives only on this device. Export a backup now and then.</p>'+
    '<div class="links"><button class="btn btn-plain" data-act="export">Export backup</button><button class="btn btn-plain" data-act="restore">Restore backup</button></div>'+
    '<div class="links" style="margin-top:8px"><button class="btn btn-plain" data-act="reset">Delete everything</button></div>'+
    '<input type="file" id="file" accept="application/json,.json" hidden></div></main>'+navBar("note");
}

function route(){
  var h = location.hash.replace(/^#\/?/,"").split("/");
  var html;
  if (h[0]==="g") html = vGroup(h[1]);
  else if (h[0]==="e") html = vEx(h[1]);
  else if (h[0]==="p") html = vProg();
  else if (h[0]==="n") html = vNote();
  else html = vHome();
  app.innerHTML = html;
}
function rerender(keepScroll){ var y = window.scrollY; route(); if (keepScroll) window.scrollTo(0,y); }

/* ---------- navigazione: indietro di sistema, gesture, scroll ---------- */
function curHash(){ var h = location.hash; return (!h || h==="#" || h==="#/") ? "#/" : h; }
var STACK = [curHash()], scrollMem = {}, pendingReplace = false;
function go(h, replace){
  if (h===curHash()) return;
  if (replace){ pendingReplace = true; location.replace(location.href.split("#")[0]+h); }
  else location.hash = h;
}
function goBack(target){
  if (STACK.length>1 && STACK[STACK.length-2]===target) history.back();
  else go(target, true);
}
function parentOf(h){
  var p = h.replace(/^#\/?/,"").split("/");
  if (p[0]==="e"){ var f = findEx(p[1]); return f ? "#/g/"+f.g.id : "#/"; }
  if (p[0]==="g" || p[0]==="p" || p[0]==="n") return "#/";
  return null;
}
function backFromHere(){ var t = parentOf(curHash()); if (t) goBack(t); return !!t; }
window.addEventListener("scroll", function(){ scrollMem[curHash()] = window.scrollY; }, {passive:true});
window.addEventListener("hashchange", function(){
  var h = curHash(), back = false;
  if (pendingReplace){ STACK[STACK.length-1] = h; pendingReplace = false; }
  else if (STACK.length>1 && STACK[STACK.length-2]===h){ STACK.pop(); back = true; }
  else STACK.push(h);
  route();
  window.scrollTo(0, back ? (scrollMem[h]||0) : 0);
});
document.addEventListener("click", function(e){
  var a = e.target.closest && e.target.closest("a[data-back],a[data-tab]"); if (!a) return;
  e.preventDefault();
  var h = a.getAttribute("href");
  if (a.hasAttribute("data-back")) return goBack(h);
  var cur = curHash();
  if (h===cur) return;
  if (h==="#/") goBack("#/");
  else if (cur==="#/") go(h);
  else go(h, true);
});
/* gesture "scorri dal bordo sinistro" per l'app installata su iPhone, che non ha il tasto indietro */
(function(){
  if (!window.navigator.standalone) return;
  var ind = document.createElement("div"); ind.className = "swipe-ind"; ind.innerHTML = I.back; document.body.appendChild(ind);
  var sx=0, sy=0, dx=0, on=false;
  document.addEventListener("touchstart", function(e){ var t=e.touches[0]; if (t.clientX<24 && parentOf(curHash())){ on=true; sx=t.clientX; sy=t.clientY; dx=0; } }, {passive:true});
  document.addEventListener("touchmove", function(e){ if (!on) return; var t=e.touches[0]; dx=t.clientX-sx; if (Math.abs(t.clientY-sy)>60){ on=false; ind.style.transform=""; return; }
    var k=Math.max(0,Math.min(dx,110)); ind.style.transform="translate("+(k*0.7-56)+"px,-50%)"; ind.classList.toggle("ready", dx>80); }, {passive:true});
  document.addEventListener("touchend", function(){ if (!on) return; on=false; ind.style.transform=""; ind.classList.remove("ready"); if (dx>80) backFromHere(); }, {passive:true});
})();


function curExId(){ var h = location.hash.split("/"); return h[1]==="e" ? h[2] : null; }
function readDraft(){
  var id = curExId(); if (!id || !draft[id]) return null;
  var kg = document.getElementById("kg"), reps = document.getElementById("reps");
  if (kg){ var v = parseFloat(kg.value.replace(",",".")); if (!isNaN(v)) draft[id].kg = Math.max(0,v); }
  if (reps){ var r = parseInt(reps.value,10); if (!isNaN(r)) draft[id].reps = Math.max(0,r); }
  return draft[id];
}

app.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), d;
  if (act==="pal"){ applyPal(b.getAttribute("data-v")); try { localStorage.setItem("ghisa-pal2", PAL); } catch(e){} rerender(true); }
  else if (act==="pg"){ P.g=b.getAttribute("data-v"); P.open=null; rerender(true); }
  else if (act==="pm"){ P.m=b.getAttribute("data-v"); rerender(true); }
  else if (act==="pr"){ P.r=b.getAttribute("data-v"); rerender(true); }
  else if (act==="popen"){ P.open = P.open===id ? null : id; rerender(true); }
  else if (act==="kg" || act==="reps"){ d = readDraft(); var step = parseFloat(b.getAttribute("data-d"));
    if (act==="kg") d.kg = Math.max(0, Math.round((d.kg+step)*100)/100); else d.reps = Math.max(0, d.reps+step);
    rerender(true); }
  else if (act==="clean" || act==="scarse"){ d = readDraft(); d.scarse = act==="scarse"; rerender(true); }
  else if (act==="saveLog"){ d = readDraft();
    if (!d.reps){ toast("Add at least one rep"); return; }
    S.logs.push({id:uid(), exId:id, date:today(), kg:d.kg, reps:d.reps, scarse:d.scarse, t:Date.now()}); d.scarse=false; save(); if (T.auto) timerStart(T.dur); rerender(true); toast(T.auto ? "Set saved · rest started" : "Set saved"); }
  else if (act==="tset"){ T.dur = +b.getAttribute("data-v"); tSave(); timerStart(T.dur); rerender(true); }
  else if (act==="tpause"){ if (T.running){ T.left = Math.max(0, T.end-Date.now()); T.running=false; releaseWake(); } else if (T.left!=null){ timerStart(T.left/1000, true); } rerender(true); }
  else if (act==="tadd"){ if (T.running) T.end += 15000; else if (T.left!=null) T.left += 15000; tick(); }
  else if (act==="tstop"){ timerStop(); rerender(true); }
  else if (act==="tauto"){ T.auto = !T.auto; tSave(); rerender(true); }
  else if (act==="delLog"){ if (confirm("Delete this set?")){ S.logs = S.logs.filter(function(l){return l.id!==id;}); save(); rerender(true); } }
  else if (act==="newGroup"){ var n = prompt("Group name (e.g. Back)"); if (n && n.trim()){ var g={id:uid(),name:n.trim(),color:COLORS[S.groups.length%COLORS.length],exercises:[]}; S.groups.push(g); save(); location.hash="#/g/"+g.id; } }
  else if (act==="renGroup"){ var g1=findGroup(id), n1=prompt("New name", g1.name); if (n1 && n1.trim()){ g1.name=n1.trim(); save(); rerender(true);} }
  else if (act==="delGroup"){ var g2=findGroup(id); if (confirm("Delete “"+g2.name+"” and all its history?")){ var ids={}; g2.exercises.forEach(function(x){ids[x.id]=1;}); S.logs=S.logs.filter(function(l){return !ids[l.exId];}); S.groups=S.groups.filter(function(x){return x!==g2;}); save(); goBack("#/"); } }
  else if (act==="newEx"){ var n2 = prompt("Exercise name"); if (n2 && n2.trim()){ var ex={id:uid(),name:n2.trim()}; findGroup(id).exercises.push(ex); save(); location.hash="#/e/"+ex.id; } }
  else if (act==="renEx"){ var f=findEx(id), n3=prompt("New name", f.ex.name); if (n3 && n3.trim()){ f.ex.name=n3.trim(); save(); rerender(true);} }
  else if (act==="delEx"){ var f2=findEx(id); if (confirm("Delete “"+f2.ex.name+"” and its history?")){ S.logs=S.logs.filter(function(l){return l.exId!==id;}); f2.g.exercises=f2.g.exercises.filter(function(x){return x.id!==id;}); save(); goBack("#/g/"+f2.g.id); } }
  else if (act==="doImport"){ var p=parseNote(noteText); if (!p.length) return; applyImport(S, p, noteDate); save(); noteText=""; toast("Imported"); goBack("#/"); }
  else if (act==="export"){ var blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ghisa-backup-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove(); }
  else if (act==="restore"){ document.getElementById("file").click(); }
  else if (act==="reset"){ if (confirm("Delete all groups, exercises and history?")){ S=empty(); save(); go("#/", true); route(); } }
});
app.addEventListener("input", function(e){
  if (e.target.id==="note"){ noteText = e.target.value; refreshPreview(); }
  else if (e.target.id==="ndate"){ noteDate = e.target.value || today(); refreshPreview(); }
});
app.addEventListener("change", function(e){
  if (e.target.id==="kg" || e.target.id==="reps"){ readDraft(); rerender(true); }
  if (e.target.id==="file" && e.target.files[0]){
    var r = new FileReader();
    r.onload = function(){ try { var s = JSON.parse(r.result); if (!s.groups || !s.logs) throw 0; if (confirm("Replace your current data with this backup?")){ S=s; save(); toast("Backup restored"); go("#/", true); route(); } } catch(err){ toast("Not a valid backup file"); } };
    r.readAsText(e.target.files[0]);
  }
});
function refreshPreview(){
  var tmp = document.createElement("div"); tmp.innerHTML = vNote();
  var np = tmp.querySelector("#preview"), op = document.getElementById("preview");
  if (np && op) op.innerHTML = np.innerHTML;
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
S = load();
if (S.seed !== 2){ applyImport(S, parseNote(SEED2), "2026-10-19"); S.seed = 2; }
save();
route();
})();
</script>
