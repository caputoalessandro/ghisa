<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6DE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ghisa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Ghisa – a simple gym log with rest timer and progress charts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ghisa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&display=swap">
<script>/* tema scelto nelle impostazioni, applicato subito per evitare il lampo chiaro */
try { if (localStorage.getItem("ghisa-theme")==="dark") document.documentElement.setAttribute("data-theme","dark"); } catch(e){}</script>
<style>
:root{
  /* tema "brutal": bordi neri spessi, ombre dure, blocchi pieni. Chiaro di default */
  --bg:#FFF6DE; --surface:#FFFFFF; --raise:#FFE7A8; --line:#111111; --dash:#111111;
  --text:#111111; --muted:#3D3D3D; --label:#111111;
  --accent:#111111; --on-accent:#C6FF3D; --hero:#C6FF3D; --on-hero:#111111; --ring:#111111;
  --nav-on:#111111; --nav-on-ink:#C6FF3D;
  --good:#0F9D4A; --good-ink:#FFFFFF;
  --bad:#E5372A; --bad-ink:#FFFFFF;
  --area:rgba(17,17,17,.08);
  --bw:2.5px; --sh:4px 4px 0 var(--line);
  /* nomi usati anche dal codice dei grafici */
  --ink:var(--text); --soft:var(--raise); --cream:var(--surface);
  --f-display:"Archivo Black",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1C1C1C; --raise:#2A2A2A; --line:#F2F2F2; --dash:#8A8A8A;
  --text:#F7F7F7; --muted:#C4C4C4; --label:#F7F7F7;
  --accent:#C6FF3D; --on-accent:#111111; --ring:#C6FF3D;
  --nav-on:#C6FF3D; --nav-on-ink:#111111;
  --good:#3EE08A; --good-ink:#06140C;
  --bad:#FF5A4E; --bad-ink:#1A0503;
  --area:rgba(198,255,61,.10);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--text);outline-offset:2px}
h1,h2{font-family:var(--f-display);margin:0;line-height:1.1;font-weight:400;text-transform:uppercase;letter-spacing:-.01em}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:16px max(16px,env(safe-area-inset-left)) 20px;display:flex;flex-direction:column;gap:14px}
.label{font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* header */
.brand{display:flex;flex-direction:column}
.brand h1{font-size:34px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:8px;box-shadow:var(--sh);font-family:var(--f-mono);font-size:12.5px;font-weight:700;white-space:nowrap}
.tag{font-family:var(--f-mono);font-weight:700;font-size:11.5px;border-radius:5px;padding:2px 7px;background:var(--raise);color:var(--text);white-space:nowrap}
.tag.scarse{background:var(--bad);color:var(--bad-ink)}
.tag.up{background:var(--good);color:var(--good-ink)}
.iconbtn{color:var(--text);width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:10px;box-shadow:var(--sh);text-decoration:none}
.iconbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.title-xl{font-size:34px}
.title-l{font-size:24px}
.title-m{font-size:17px}

/* cards */
.hero{background:var(--hero);color:var(--on-hero);border:var(--bw) solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.hero .label{color:var(--on-hero)}
.hero .big{font-family:var(--f-display);text-transform:uppercase;font-size:21px;line-height:1.15}
.hero .sub{color:var(--on-hero)}
.btn{border:var(--bw) solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:10px 16px;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.04em;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none;color:var(--text);background:var(--surface)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.btn:disabled{opacity:.5}
.btn-accent,.btn-ink{background:var(--accent);color:var(--on-accent)}
.btn-dash{background:transparent;border-style:dashed;box-shadow:none;font-size:14px;min-height:42px}
.btn-dash:active{transform:none}
.btn-plain{background:var(--surface);font-size:14px;min-height:42px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gcard{text-align:left;background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:11px 12px;display:flex;flex-direction:column;gap:5px;min-height:84px;text-decoration:none;color:inherit}
.gcard:active,.erow:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.gcard b{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:17px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--line)}
.gnew{min-height:84px;flex-direction:column;border-radius:12px}

.list{display:flex;flex-direction:column;gap:10px}
.erow{display:flex;align-items:center;gap:12px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:9px 12px;min-height:58px;text-decoration:none;color:inherit}
.tick{width:30px;height:30px;font-family:var(--f-mono);font-weight:700;font-size:11.5px;flex:none;border:var(--bw) solid var(--line);border-radius:50%;display:grid;place-items:center}
.erow.done .tick{background:var(--good);color:var(--good-ink)}
.erow.part .tick{background:var(--hero);color:#111}
.ename{font-weight:800;font-size:16.5px;line-height:1.2}
.esub{font-size:13px;color:var(--muted)}
.eval{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;font-family:var(--f-mono)}
.eval b{font-size:17px;color:var(--text)}
.eval span{font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:12px;background:var(--surface);border:2px solid var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
/* card piene del colore del gruppo: i colori sono chiari, quindi sopra testo nero */
.tinted{background:var(--gc);color:#111}
.tinted .muted,.tinted .esub,.tinted .eval span,.tinted .eval b,.tinted .ename{color:#111}
.tinted .tag{background:#fff;color:#111;border:2px solid #111}
.tinted .dot{background:#111!important;box-shadow:none}
.tinted .tick{border-color:#111}
.tinted .spark polyline{stroke:#111}
.tinted .spark polygon{fill:rgba(17,17,17,.14)!important}
.tinted .spark circle{fill:#111!important;stroke:#fff}
.gtop{border-top:8px solid var(--gc)}
.sets{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sdots{display:flex;gap:5px;flex:1;min-width:0;flex-wrap:wrap}
.sdots i{width:22px;height:22px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center}
.sdots i.on{background:var(--good);color:var(--good-ink)}
.sdots i.extra{background:var(--raise);border-color:var(--good)}
.mini{display:flex;align-items:center;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raise)}
.mini button{width:30px;height:30px;border:0;background:transparent;display:grid;place-items:center;font-weight:800;font-size:16px}
.mini span{font-family:var(--f-mono);font-weight:700;font-size:12.5px;padding:0 4px;white-space:nowrap}

/* log card */
.logcard{background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:48px;height:48px;flex:none;border:2px solid var(--line);border-radius:10px;background:var(--raise);display:grid;place-items:center}
.step button:active{background:var(--hero);color:#111}
.step input{flex:1;min-width:0;width:100%;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:34px;line-height:1;border:0;background:transparent;padding:0;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{font-weight:700;font-size:14px;margin-left:-6px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{border:var(--bw) solid var(--line);border-radius:10px;padding:6px;background:transparent;font-weight:800;font-size:14px;min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--good);color:var(--good-ink)}
.seg button.sc[aria-pressed="true"]{background:var(--bad);color:var(--bad-ink)}

.panel{background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:2px solid var(--line);font-size:14px}
.prow:last-child{border-bottom:0}
.prow .x{width:36px;height:36px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;margin:-6px -8px -6px 0;color:var(--muted)}
.phead{padding:8px 12px;background:var(--raise);color:var(--label);border-bottom:2px solid var(--line);font-family:var(--f-mono);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.empty{padding:16px 14px;text-align:center;color:var(--muted);background:transparent;border:var(--bw) dashed var(--line);border-radius:12px}

textarea{width:100%;min-height:220px;resize:vertical;border:var(--bw) solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:14px;font-family:var(--f-mono);font-size:13px;line-height:1.6;background:var(--surface)}
textarea::placeholder{color:var(--muted);opacity:.6}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:10px;box-shadow:var(--sh);padding:8px 12px}
.field input{border:0;background:transparent;font-family:var(--f-mono);font-weight:700;font-size:15px;flex:1;min-width:0}
.warn{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;font-size:13px;font-weight:700;background:#FFD23F;color:#111;border-top:2px solid var(--line)}
.links{display:flex;flex-wrap:wrap;gap:10px}
.links button{flex:1 1 140px}

nav{position:sticky;bottom:0;display:flex;justify-content:space-around;align-items:center;padding:6px 12px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:var(--bw) solid var(--line);z-index:5}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--text);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em;min-width:72px;padding:5px 10px;border:2px solid transparent;border-radius:10px}
nav a[aria-current="page"]{background:var(--nav-on);color:var(--nav-on-ink);border-color:var(--line)}
.sticky-foot{position:sticky;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:var(--bw) solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:800;transition:.2s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
/* progressi */
.pseg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:3px;gap:3px}
.pseg button{border:0;border-radius:8px;background:transparent;font-weight:800;font-size:14px;min-height:36px;color:var(--text)}
.pseg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.sumrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sumrow div{display:flex;flex-direction:column;background:#FFFFFF;color:#111;border:2px solid #111;border-radius:8px;padding:8px 10px}
.sumrow b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1}
.sumrow span{font-size:12.5px;color:#111}
.spark-wrap{width:96px;flex:none}
.spark{display:block;width:96px;height:34px}
.big{display:block;width:100%;height:auto;margin-top:10px}
.ax{font-family:var(--f-mono);font-size:10px;fill:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:10px;height:10px;border-radius:50%;background:var(--text);border:2px solid var(--text);display:inline-block}
.lg-dot.hollow{background:var(--surface)}
.lg-line{width:16px;height:6px;border-radius:3px;border:1.5px solid #111;display:inline-block}
.lg-dash{width:18px;border-top:2px dashed var(--text);display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:7px 9px}
.stats span{font-size:11px;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* timer */
.timer{background:var(--surface);border:var(--bw) solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.timer.done{background:var(--good);color:var(--good-ink)}
.tauto{border:2px solid var(--line);border-radius:999px;background:transparent;font-weight:800;font-size:12.5px;padding:6px 12px;min-height:34px;display:inline-flex;align-items:center;gap:5px;color:var(--text)}
.tauto[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tring{position:relative;width:136px;height:136px;margin:0 auto}
.tring svg{width:100%;height:100%;display:block}
.tring circle{transition:stroke-dashoffset .25s linear}
#tarc{stroke:var(--ring)}
.timer.done #tarc{stroke:var(--good-ink)}
.tcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tdisp{font-family:var(--f-mono);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tdur{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tdur button{border:2px solid var(--line);border-radius:10px;background:var(--raise);font-weight:800;font-size:15px;min-height:44px}
.tdur button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tpill{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:8;background:var(--accent);color:var(--on-accent);border:var(--bw) solid var(--line);border-radius:999px;padding:8px 14px;font-family:var(--f-mono);font-weight:700;font-size:14px;box-shadow:var(--sh)}
.tpill[hidden]{display:none}
.lgrp{display:flex;flex-direction:column;gap:4px}
.lgname{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14.5px}
.hero ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hero li{display:flex;align-items:baseline;gap:8px;padding:4px 0;border-bottom:2px solid var(--on-hero);font-size:14px}
.hero li:last-child{border-bottom:0}
.hero .ln{flex:1;min-width:0}
.hero .lk{font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.hero .lr{font-family:var(--f-mono);font-size:12.5px;width:76px;text-align:right;white-space:nowrap}
.hero .dot{box-shadow:0 0 0 2px var(--on-hero)}
/* impostazioni */
.opt{display:flex;flex-direction:column;gap:8px}
.opt .seg button{min-height:48px;font-size:15px}
.opt .seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
/* mascotte: piccola e discreta */
.bell{display:block;overflow:visible}
.bellwrap{position:relative;display:flex;flex-direction:column;align-items:flex-end;flex:none}
.bellwrap .bell{width:50px;height:auto}
/* nel tema scuro il contorno nero sparirebbe: bordo chiaro tipo adesivo */
:root[data-theme="dark"] .bell{filter:drop-shadow(1.5px 0 0 #F2F2F2) drop-shadow(-1.5px 0 0 #F2F2F2) drop-shadow(0 1.5px 0 #F2F2F2) drop-shadow(0 -1.5px 0 #F2F2F2)}
.bubble,.tstage .bellwrap{display:none}
.tstage{position:relative;display:flex;justify-content:center}
.empty .bellwrap{align-items:center;margin:0 auto 6px}
.swipe-ind{position:fixed;left:0;top:50%;transform:translate(-56px,-50%);width:44px;height:44px;border-radius:50%;background:var(--surface);border:var(--bw) solid var(--line);display:grid;place-items:center;z-index:20;transition:transform .15s ease-out,background .15s;pointer-events:none}
.swipe-ind.ready{background:var(--hero);color:#111}
#tarc,.tring circle{stroke-width:12}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<button class="tpill" id="tpill" hidden>Rest</button>
<script>
(function(){
"use strict";
var KEY = "ghisa-v1";
/* colori dei gruppi: pieni e chiari, così sopra ci sta il testo nero in entrambi i temi */
var COLORS = ["#B6F23A","#2EE6D0","#7AB0FF","#FF8A5C","#FFD23F","#C9A2FF","#5EEA8F","#FF7AB6"];
/* il colore dipende dalla posizione del gruppo, così anche i gruppi già salvati prendono la nuova palette */
function gColor(g){ var i = S.groups.indexOf(g); return COLORS[(i<0?0:i)%COLORS.length]; }
var SEED2 = "SPALLE\nCavo - 4kg - 16\nLateral raise manubri — 12kg - 8 scarse\n\nBICIPITI\nHummer curl - 18kg - 5\n\nPETTO\nChest inclined - 20kg - 9\nGAMBE\nHip trust dischi - 35kg - 10";
var SEED = "SPALLE\nMilitarypress — 9kg - 7\nCavo - 4kg - 16\nLateral raise manubri — 12kg - 8 scarse\nMacchina - 50kg - 7\n\nBICIPITI\nBilanciere curl — 6kg - 6\nHummer curl - 18kg - 5\nPanca Scott — 11kg - 8 scarse\nIncline dumbbell curl — 10KG - 10\n\nPETTO\nPanca piana- 22,5 kg - 4\nChest press - 27,5kg - 12\nChest inclined - 20kg - 9\nPanca inclined - 17,5kg - 5\nPec dek - 45kg-12\n\nTRICIPITI\nClose grip bench press - 18kg - 8\nCable overhead triceps extension -18kg - 12\nCable triceps pushdown (basso) — 18kg - 17\n\nGAMBE\nSquat - 15kg - 10\nHip trust macchina cavo - 80kg - 10\nHip trust dischi - 35kg - 10";

var I = {
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>',

function uid(){ return Math.random().toString(36).slice(2,10); }
function iso(d){ var z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function today(){ return iso(new Date()); }
function daysAgo(n){ var d = new Date(); d.setDate(d.getDate()-n); return iso(d); }
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,""); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmtKg(n){ return (Math.round(n*100)/100).toString(); }

function findGroup(id){ for (var i=0;i<S.groups.length;i++) if (S.groups[i].id===id) return S.groups[i]; return null; }
function logsOf(exId){ return S.logs.filter(function(l){return l.exId===exId;}).sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:a.t-b.t; }); }
function lastDateOfGroup(g){
  var ids = {}; g.exercises.forEach(function(e){ids[e.id]=1;});
  var d = null; S.logs.forEach(function(l){ if (ids[l.exId] && (!d || l.date>d)) d=l.date; }); return d;
}
function rel(date){
  if (!date) return "never";
  var a = new Date(date+"T00:00:00"), b = new Date(today()+"T00:00:00");
  var n = Math.round((b-a)/86400000);
  if (n<=0) return "today"; if (n===1) return "yesterday"; if (n<7) return n+"d ago";

}

function shortDate(date){ var d = new Date(date+"T00:00:00"); return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3); }

/* ---------- lettura del blocco note ---------- */
var LINE = /^(.+?)\s*[—–\-]+\s*(\d+(?:[.,]\d+)?)\s*(?:kg)?\s*[—–\-x×]*\s*(\d+)\s*(.*)$/i;
function parseNote(text){
  var out = [], cur = null, bad = [];
  text.split(/\r?\n/).forEach(function(raw){
    var line = raw.trim(); if (!line) return;
    var m = line.match(LINE);
    if (m){
      if (!cur){ cur = {name:"No group", items:[]}; out.push(cur); }
      cur.items.push({ name:m[1].trim(), kg:parseFloat(m[2].replace(",",".")), reps:parseInt(m[3],10), scarse:/scars|barely|struggl/i.test(m[4]) });
    } else if (!/\d/.test(line) && /[a-zà-ú]/i.test(line) && line===line.toUpperCase()){
      cur = { name:cap(line.replace(/:$/,"")), items:[] }; out.push(cur);
    } else bad.push(line);
  });
  out = out.filter(function(g){return g.items.length;});
  out.bad = bad; return out;
}
function applyImport(state, parsed, date){
  var renamed = [], t = Date.now();
  parsed.forEach(function(pg){
    var g = state.groups.filter(function(x){return norm(x.name)===norm(pg.name);})[0];
    if (!g){ g = {id:uid(), name:pg.name, color:COLORS[state.groups.length%COLORS.length], exercises:[]}; state.groups.push(g); }
    pg.items.forEach(function(it){
      var ex = g.exercises.filter(function(e){return norm(e.name)===norm(it.name);})[0];
      if (ex && ex.name!==it.name) renamed.push([it.name, ex.name]);
      if (!ex){ ex = {id:uid(), name:it.name}; g.exercises.push(ex); }
      state.logs.push({id:uid(), exId:ex.id, date:date, kg:it.kg, reps:it.reps, scarse:it.scarse, t:t++});
    });
  });
  return renamed;
}

var T = { dur:90, auto:true, running:false, end:0, left:null, total:90000, done:false, ex:null };
try { var ts = JSON.parse(localStorage.getItem("ghisa-timer")); if (ts){ T.dur = ts.dur||90; T.auto = ts.auto!==false;
  if (ts.running && ts.end){ T.running = true; T.end = ts.end; T.total = ts.total||T.dur*1000; T.ex = ts.ex||null; }
  else if (ts.left!=null){ T.left = ts.left; T.total = ts.total||T.dur*1000; T.ex = ts.ex||null; } } } catch(e){}
if ([60,120,180].indexOf(T.dur)<0) T.dur = 60;

function beep(){
  if (!actx) return;
  [0,0.28,0.56].forEach(function(t0,i){
    var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime+t0;
    o.type="square"; o.frequency.value = i===2 ? 1320 : 880;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.24);
  });
}

function timerStart(sec, resume){
  unlockAudio();
  if (!resume) T.total = sec*1000;
  if (curExId()) T.ex = curExId();

  var rem = tRemaining(), frac = (T.running||T.left!=null) ? Math.max(0,Math.min(1,rem/T.total)) : 1;
  var state = T.done ? "Done" : T.running ? "Running" : T.left!=null ? "Paused" : "Ready";
  var opts = [[60,"1 min"],[120,"2 min"],[180,"3 min"]].map(function(o){
    return '<button data-act="tset" data-v="'+o[0]+'" aria-pressed="'+(T.dur===o[0])+'">'+o[1]+'</button>'; }).join("");
  var active = T.running || T.left!=null;
  return '<section class="timer'+(T.done?" done":"")+'" aria-label="Rest timer">'+
    '<div class="row between"><h2 class="title-m">Rest</h2><button class="tauto" data-act="tauto" aria-pressed="'+T.auto+'">'+(T.auto?I.checkInk:"")+'Auto-start on Save</button></div>'+
    '<div class="tstage"><div class="tring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="84" fill="none" style="stroke:var(--soft)" stroke-width="16"/>'+
      '<circle id="tarc" cx="100" cy="100" r="84" fill="none" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+RING.toFixed(1)+'" stroke-dashoffset="'+(RING*(1-frac)).toFixed(1)+'" transform="rotate(-90 100 100)"/></svg>'+
      '<div class="tcenter"><span id="tdisp" class="tdisp" role="timer" aria-live="off">'+(T.done?"Go!":fmtT(rem))+'</span><span id="tstate" class="label" style="color:var(--muted)">'+state+'</span></div></div>'+
      (T.done ? bellSay("go",64,"Go! Next set") : T.running ? bellSay("rest",64,"Breathe…") : T.left!=null ? bellSay("sleep",64,"Paused") : bellSay("hi",64,"Rest between sets"))+'</div>'+
    '<div class="tdur" role="group" aria-label="Duration">'+opts+'</div>'+

            : '<p class="muted" style="margin:0;font-size:14px;text-align:center">Tap 1, 2 or 3 min to start your rest.</p>')+
    '</section>';
}
function tick(){
  var pill = document.getElementById("tpill");
  if (T.running && tRemaining()<=0){
    var late = Date.now()-T.end > 3000;   /* finito mentre l'app era chiusa o in background */
    T.running=false; T.left=null; T.done=true; releaseWake(); tSave();
    if (!late){ try { navigator.vibrate && navigator.vibrate([300,150,300,150,500]); } catch(e){} beep(); }
    toast("Rest over · next set!");
    if (document.getElementById("tdisp")) rerender(true);
    setTimeout(function(){ if (T.done){ T.done=false; if (document.getElementById("tdisp")) rerender(true); else tick(); } }, 8000);
  }
  var rem = tRemaining(), d = document.getElementById("tdisp"), arc = document.getElementById("tarc");
  if (d && !T.done) d.textContent = fmtT(rem);
  if (arc && (T.running||T.left!=null)) arc.setAttribute("stroke-dashoffset", (RING*(1-Math.max(0,Math.min(1,rem/T.total)))).toFixed(1));
  if (pill){
    var show = (T.running || T.done || T.left!=null) && !d;
    pill.hidden = !show;
    if (show) pill.innerHTML = T.done ? "Rest over · next set" : (T.running ? "Rest " : "Paused ")+fmtT(rem);
  }
}

  var week = {}; S.logs.forEach(function(l){ if (l.date>=daysAgo(6)) week[l.date]=1; });
  var nWeek = Object.keys(week).length;
  var last = null; S.logs.forEach(function(l){ if (!last || l.date>last) last=l.date; });
  var hero = "";
  if (last){
    var dayLogs = S.logs.filter(function(l){return l.date===last;});
    var blocks = S.groups.map(function(g){
      var rows = g.exercises.map(function(ex){
        var ls = dayLogs.filter(function(l){return l.exId===ex.id;});
        if (!ls.length) return "";
        var top = ls.reduce(function(a,l){ return l.kg>a.kg ? l : a; }, ls[0]);
        return '<li><span class="ln">'+esc(ex.name)+'</span><span class="lk">'+fmtKg(top.kg)+' kg</span><span class="lr">× '+top.reps+' reps</span></li>';
      }).join("");
      return rows ? '<div class="lgrp"><span class="lgname"><i class="dot" style="background:'+gColor(g)+';"></i>'+esc(g.name)+'</span><ul>'+rows+'</ul></div>' : "";
    }).join("");
    hero = '<section class="hero"><span class="label">'+(last===today()?"Today":"Last workout · "+esc(longDay(last)))+'</span>'+blocks+'</section>';
  } else {
    hero = '<section class="hero"><span class="label">Welcome</span><div class="big">Create a group or import your notes</div><a class="btn btn-accent" href="#/n">'+I.note+' Import from notes</a></section>';
  }
  var nEx = S.groups.reduce(function(a,g){return a+g.exercises.length;},0);
  var cards = S.groups.map(function(g){
    var d = lastDateOfGroup(g);
    return '<a class="gcard tinted" style="--gc:'+gColor(g)+'" href="#/g/'+g.id+'"><span class="row between"><b>'+esc(g.name)+'</b><span class="dot" style="background:'+gColor(g)+'"></span></span>'+
      '<span class="muted" style="font-size:14px">'+g.exercises.length+(g.exercises.length===1?' exercise':' exercises')+'</span><span class="tag" style="align-self:flex-start">'+esc(rel(d))+'</span></a>';
  }).join("");
  var trainedToday = last===today();
  return '<main><div class="row between" style="align-items:flex-end"><div class="brand"><h1>Ghisa</h1><span class="label">Gym log</span>'+
    '<span class="row" style="margin-top:12px;gap:12px"><span class="chip">'+I.flame+nWeek+' this week</span><a class="iconbtn" href="#/s" aria-label="Settings">'+I.gear+'</a></span></div>'+
    bellSay(trainedToday?"flex":"hi", 104, trainedToday?"Nice work today!":GREET, "home")+'</div>'+hero+
    '<div class="row between" style="align-items:baseline;margin-top:4px"><h2 class="title-m">Your groups</h2><span class="mono muted" style="font-size:12px">'+nEx+' exercises</span></div>'+
    '<div class="grid2">'+cards+'<button class="btn btn-dash gnew" data-act="newGroup">'+I.plus+'New group</button></div></main>'+navBar("home");
}

function vGroup(id){
  var g = findGroup(id); if (!g) return vHome();
  var t = today(), done = 0, n = g.exercises.length;
  var rows = g.exercises.map(function(ex){
    var ls = logsOf(ex.id), todays = ls.filter(function(l){return l.date===t;});
    var goal = setsGoal(ex), isDone = todays.length>=goal; if (isDone) done++;
    var ref = isDone ? todays[todays.length-1] : ls[ls.length-1];
    var sub;
    if (todays.length) sub = "Today · "+todays.length+" of "+goal+" sets";
    else if (ref) sub = "Last time · "+rel(ref.date)+(ref.scarse?" · barely":"");
    else sub = "No sets yet · "+goal+" sets";
    return '<a class="erow'+(isDone?" done":todays.length?" part":"")+'" href="#/e/'+ex.id+'"><span class="tick">'+(isDone?I.check:todays.length?todays.length+"/"+goal:"")+'</span>'+
      '<span class="grow"><span class="ename" style="display:block">'+esc(ex.name)+'</span><span class="esub">'+esc(sub)+'</span></span>'+
      (ref?'<span class="eval"><b>'+fmtKg(ref.kg)+' kg</b><span>× '+ref.reps+' reps</span></span>':'')+'</a>';
  }).join("");
  var pct = n? Math.round(done/n*100):0;
  return '<main>'+topBack("#/",'<span class="dot" style="width:18px;height:18px;background:'+gColor(g)+'"></span>')+
    '<div style="display:flex;flex-direction:column;gap:6px"><div class="row between" style="align-items:flex-end"><div class="grow"><span class="label">Today · '+esc(longDay(t))+'</span><h1 class="title-xl">'+esc(g.name)+'</h1></div>'+
    (n ? (done===n ? bellSay("flex",70,"All done!") : done ? bellSay("go",70,(n-done)+" to go!") : bellSay("hi",70,"Let's go!")) : "")+'</div>'+
    '<div class="row" style="margin-top:6px"><div class="bar"><i style="width:'+pct+'%;background:'+gColor(g)+'"></i></div><span class="mono" style="font-weight:700;font-size:13px">'+done+'/'+n+'</span></div></div>'+
    '<div class="list">'+(rows||'<div class="empty">'+bellSay("sleep",70,"")+'No exercises yet. Add one below.</div>')+'</div>'+
    '<button class="btn btn-dash" data-act="newEx" data-id="'+g.id+'">'+I.plus+'Add exercise</button>'+
    '<div class="links"><button class="btn btn-plain" data-act="renGroup" data-id="'+g.id+'">Rename group</button><button class="btn btn-plain" data-act="delGroup" data-id="'+g.id+'">Delete group</button></div>'+
    '</main><div class="sticky-foot"><a class="btn btn-ink" data-back href="#/">Done</a></div>';
}

function vEx(id){
  var f = findEx(id); if (!f) return vHome();
  var ls = logsOf(id), t = today(), last = ls[ls.length-1];
  var prev = ls.filter(function(l){return l.date!==t;}); prev = prev[prev.length-1];
  if (!draft[id]) draft[id] = { kg: last?last.kg:10, reps: last?last.reps:10, scarse:false };
  var dr = draft[id];
  var todays = ls.filter(function(l){return l.date===t;});
  var idx = f.g.exercises.indexOf(f.ex)+1, goal = setsGoal(f.ex), nDone = todays.length;
  var dots = ""; for (var k=0;k<Math.max(goal,nDone);k++) dots += '<i class="'+(k<nDone?(k<goal?"on":"on extra"):"")+'">'+(k<nDone&&k<goal?I.check.replace(/18/g,"12"):"")+'</i>';
  var setsRow = '<div class="sets"><span class="label" style="color:var(--muted)">Sets</span><div class="sdots" aria-label="'+nDone+' of '+goal+' sets done">'+dots+'</div>'+
    '<div class="mini" role="group" aria-label="Sets goal"><button data-act="sgoal" data-id="'+id+'" data-d="-1" aria-label="One set less">−</button><span>goal '+goal+'</span><button data-act="sgoal" data-id="'+id+'" data-d="1" aria-label="One set more">+</button></div></div>';
  var saveLbl = nDone<goal ? "Save set "+(nDone+1)+"/"+goal : "Extra set";
  var todayHtml = todays.length ? '<div class="panel"><div class="phead">Today\'s sets</div>'+todays.map(function(l,i){
    return '<div class="prow"><span class="mono muted" style="width:22px">'+(i+1)+'</span><span class="grow mono" style="font-weight:700">'+fmtKg(l.kg)+' kg × '+l.reps+' reps</span>'+
      (l.scarse?'<span class="tag scarse">barely</span>':'')+'<button class="x" data-act="delLog" data-id="'+l.id+'" aria-label="Delete set">'+I.x+'</button></div>';
  }).join("")+'</div>' : "";
  return '<main><div class="row"><a class="iconbtn" data-back href="#/g/'+f.g.id+'" aria-label="Back">'+I.back+'</a>'+
    '<div class="grow"><span class="label">'+esc(f.g.name)+' · '+idx+' of '+f.g.exercises.length+'</span><h1 class="title-l">'+esc(f.ex.name)+'</h1></div></div>'+
    '<section class="logcard gtop" style="--gc:'+gColor(f.g)+'">'+setsRow+
      (prev?'<div class="row" style="font-size:14px;flex-wrap:wrap;gap:8px"><span class="muted">Last time:</span><span class="mono" style="font-weight:700">'+fmtKg(prev.kg)+' kg × '+prev.reps+' reps</span>'+(prev.scarse?'<span class="tag scarse">BARELY</span>':'')+'</div>':'')+
      '<div><label class="label" for="kg" style="color:var(--muted)">Weight · step 1.25 kg</label><div class="step">'+
        '<button data-act="kg" data-d="-1.25" aria-label="Remove 1.25 kg">'+I.minus+'</button><input id="kg" inputmode="decimal" value="'+fmtKg(dr.kg)+'"><span class="unit">kg</span>'+
        '<button data-act="kg" data-d="1.25" aria-label="Add 1.25 kg">'+I.plus+'</button></div></div>'+
      '<div><label class="label" for="reps" style="color:var(--muted)">Reps</label><div class="step">'+
        '<button data-act="reps" data-d="-1" aria-label="One rep less">'+I.minus+'</button><input id="reps" inputmode="numeric" value="'+dr.reps+'"><span class="unit">reps</span>'+
        '<button data-act="reps" data-d="1" aria-label="One rep more">'+I.plus+'</button></div></div>'+
      '<div class="seg"><button data-act="clean" aria-pressed="'+!dr.scarse+'">Clean</button><button class="sc" data-act="scarse" aria-pressed="'+dr.scarse+'">'+(dr.scarse?I.checkInk:"")+'Barely</button></div>'+
      '<button class="btn btn-accent" data-act="saveLog" data-id="'+id+'"><span>'+saveLbl+' · '+fmtKg(dr.kg)+' kg × '+dr.reps+' reps</span></button>'+
    '</section>'+timerHtml()+todayHtml+
    '<div class="links"><button class="btn btn-plain" data-act="renEx" data-id="'+id+'">Rename</button><button class="btn btn-plain" data-act="delEx" data-id="'+id+'">Delete exercise</button></div>'+
    '</main>';
}

/* ---------- progressi (sola lettura): generale → gruppo → esercizio ---------- */
/* colori dei grafici: presi dal tema attivo prima di ogni disegno */
var CH = {};
function chartColors(){ var cs = getComputedStyle(document.documentElement); function v(n){ return cs.getPropertyValue(n).trim(); }
  CH.ink = v("--text"); CH.hollow = CH.halo = v("--surface"); CH.grid = v("--raise"); }
var P = { m:"kg", r:"all", ov:"lines" };
var METRICS = {
  "kg": { label:"Weight", info:"The heaviest weight you lifted in each workout." },
  "rw": { label:"Reps × kg", info:"Your best single set: weight × reps. It goes up when you add weight or reps." }
};
var RANGES = { "1m":["1 month",31], "3m":["3 months",92], "all":["All time",0] };
function series(exId, m, r){
  var from = RANGES[r][1] ? daysAgo(RANGES[r][1]) : "";
  var by = {};
  logsOf(exId).forEach(function(l){
    if (l.date < from) return;
    var o = by[l.date] || (by[l.date] = {date:l.date, v:0, scarse:false, sets:[], top:null});
    var val = m==="kg" ? l.kg : l.kg*l.reps;
    if (!o.top || val>o.v || (val===o.v && l.reps>o.top.reps)){ o.v = val; o.top = l; }
    if (l.scarse) o.scarse = true;
    o.sets.push(l);
  });
  return Object.keys(by).sort().map(function(d){ return by[d]; });
}
function dnum(d){ return new Date(d+"T00:00:00").getTime()/86400000; }
function fmtV(v){ return v>=1000 ? (Math.round(v/100)/10).toString()+"k" : fmtKg(Math.round(v*2)/2); }
function fmtPct(v){ var r = Math.round(v); return (r>0?"+":r<0?"−":"")+Math.abs(r)+"%"; }
function trendOf(s){
  if (s.length<2) return {pct:0, kind:"one"};
  var a = s[0].v, b = s[s.length-1].v, pct = a ? (b-a)/a*100 : 0;
  return {pct:pct, kind: pct>=2 ? "up" : pct<=-2 ? "down" : "flat"};
}
function trendTag(t){
  if (t.kind==="one") return '<span class="tag">1 workout</span>';
  var n = Math.round(Math.abs(t.pct));
  if (t.kind==="up") return '<span class="tag up">↑ '+n+'%</span>';
  if (t.kind==="down") return '<span class="tag scarse">↓ '+n+'%</span>';
  return '<span class="tag">= steady</span>';
}
/* una seduta a parole, sempre con kg e reps */
function setTxt(l){ return fmtKg(l.kg)+" kg × "+l.reps+" reps"; }
function pLabel(p, m){ return m==="rw" ? setTxt(p.top) : fmtKg(p.v)+" kg"; }
/* serie di una seduta raggruppate per peso: "22.5 kg × 8, 7, 6 reps" */
function setsTxt(sets){
  var out = [], cur = null;
  sets.forEach(function(l){ if (cur && cur.kg===l.kg) cur.reps.push(l.reps); else { cur = {kg:l.kg, reps:[l.reps]}; out.push(cur); } });
  return out.map(function(o){ return fmtKg(o.kg)+" kg × "+o.reps.join(", ")+" reps"; }).join(" · ");
}
function spark(s, W, H){
  W = W||96; H = H||34; var pad=4;
  if (!s.length) return '';
  if (s.length===1) return '<svg viewBox="0 0 '+W+' '+H+'" class="spark" style="width:'+W+'px;height:'+H+'px" aria-hidden="true"><circle cx="'+(W-pad-2)+'" cy="'+H/2+'" r="4" fill="'+CH.ink+'"/></svg>';
  var x0=dnum(s[0].date), x1=dnum(s[s.length-1].date)||x0+1, vs=s.map(function(p){return p.v;}), mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  if (mx===mn){ mx+=1; mn-=1; }
  var pts = s.map(function(p){ return [pad+(dnum(p.date)-x0)/((x1-x0)||1)*(W-2*pad), H-pad-(p.v-mn)/(mx-mn)*(H-2*pad)]; });
  var line = pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ");
  var last = pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" class="spark" style="width:'+W+'px;height:'+H+'px" aria-hidden="true"><polygon points="'+pad+','+(H-pad)+' '+line+' '+last[0].toFixed(1)+','+(H-pad)+'" style="fill:var(--area)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="'+CH.ink+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4" style="fill:var(--accent)" stroke="'+CH.halo+'" stroke-width="2"/></svg>';
}
function bigChart(s, m){
  var W=320, H=180, L=m==="kg"?46:14, R=14, T=22, B=26;
  if (s.length<2) return '<div class="empty" style="padding:14px">The chart shows up after your second workout.</div>';
  var x0=dnum(s[0].date), x1=dnum(s[s.length-1].date), vs=s.map(function(p){return p.v;}), mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  var span = (mx-mn) || mx*0.1 || 1; mn = Math.max(0, mn-span*0.25); mx = mx+span*0.25;
  function X(d){ return L+(dnum(d)-x0)/((x1-x0)||1)*(W-L-R); }
  function Y(v){ return T+(1-(v-mn)/(mx-mn))*(H-T-B); }
  var g = "";
  /* in "Reps × kg" il valore è un prodotto: niente numeri sull'asse, parlano le etichette sui punti */
  for (var i=0;i<3;i++){ var v = mn+(mx-mn)*(i+0.5)/3, y=Y(v);
    g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+CH.grid+'" stroke-width="1"/>'+(m==="kg"?'<text x="'+(L-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" class="ax">'+fmtV(v)+' kg</text>':''); }
  /* linea di tendenza (regressione lineare) */
  var n=s.length, sx=0, sy=0, sxx=0, sxy=0;
  s.forEach(function(p){ var x=dnum(p.date)-x0; sx+=x; sy+=p.v; sxx+=x*x; sxy+=x*p.v; });
  var den = n*sxx-sx*sx, k = den ? (n*sxy-sx*sy)/den : 0, q = (sy-k*sx)/n;
  var trend = '<line x1="'+L+'" y1="'+Y(q).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(q+k*(x1-x0)).toFixed(1)+'" style="stroke:var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>';
  var line = s.map(function(p){return X(p.date).toFixed(1)+","+Y(p.v).toFixed(1);}).join(" ");
  var area = '<polygon points="'+L+','+(H-B)+' '+line+' '+(W-R)+','+(H-B)+'" style="fill:var(--area)"/>';
  var dots = s.map(function(p){ return '<circle cx="'+X(p.date).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4.5" fill="'+(p.scarse?CH.hollow:CH.ink)+'" stroke="'+CH.ink+'" stroke-width="2"/>'; }).join("");
  /* etichette: prima e ultima seduta (tutte se sono poche e in kg) */
  var lab = s.map(function(p,i){ if (i<n-1 && (m==="rw" || (i>0 && n>5))) return "";
    var anchor = i===0 ? "start" : i===n-1 ? "end" : "middle";
    return '<text x="'+X(p.date).toFixed(1)+'" y="'+(Y(p.v)-9).toFixed(1)+'" text-anchor="'+anchor+'" class="ax" style="font-weight:700;fill:'+CH.ink+';paint-order:stroke;stroke:'+CH.halo+';stroke-width:3px">'+esc(pLabel(p,m))+'</text>'; }).join("");
  var xl = '<text x="'+L+'" y="'+(H-8)+'" class="ax">'+shortDate(s[0].date)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" class="ax">'+shortDate(s[n-1].date)+'</text>';
  if (n>2){ var mid = s[Math.floor(n/2)]; xl += '<text x="'+X(mid.date).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" class="ax">'+shortDate(mid.date)+'</text>'; }
  var perWeek = k*7, wk;
  if (m==="kg") wk = Math.abs(perWeek)<0.05 ? "steady" : (perWeek>0?"+":"−")+fmtKg(Math.round(Math.abs(perWeek)*10)/10)+" kg per week";
  else { var pw = sy/n ? perWeek/(sy/n)*100 : 0; wk = Math.abs(pw)<0.5 ? "steady" : fmtPct(pw)+" per week"; }
  return '<svg viewBox="0 0 '+W+' '+H+'" class="big" role="img" aria-label="Progress over time">'+g+area+trend+'<polyline points="'+line+'" fill="none" stroke="'+CH.ink+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+dots+lab+xl+'</svg>'+
    '<div class="legend"><span><i class="lg-dot"></i>workout</span><span><i class="lg-dot hollow"></i>barely</span><span><i class="lg-dash"></i>trend: '+wk+'</span></div>';
}

/* progressi generali: ogni esercizio come % rispetto alla sua prima seduta, e la media di queste linee */
function pctLine(exId){
  var s = series(exId, P.m, P.r); if (s.length<2 || !s[0].v) return null;
  return s.map(function(p){ return {date:p.date, v:(p.v/s[0].v-1)*100}; });
}
function avgLine(lines){
  var dates = {}; lines.forEach(function(l){ l.pts.forEach(function(p){ dates[p.date]=1; }); });
  return Object.keys(dates).sort().map(function(d){
    var sum=0, k=0;
    lines.forEach(function(l){ var last=null; l.pts.forEach(function(p){ if (p.date<=d) last=p; }); if (last){ sum+=last.v; k++; } });
    return {date:d, v:k?sum/k:0};
  });
}
function overallLines(groups){
  var out = [];
  groups.forEach(function(g){ g.exercises.forEach(function(ex){ var pts = pctLine(ex.id); if (pts) out.push({g:g, ex:ex, pts:pts}); }); });
  return out;
}
function overallChart(lines, mode){

  var W=320, H=190, L=42, R=14, T=16, B=26;

  /* una linea per gruppo: la media dei suoi esercizi */
  var groups = []; lines.forEach(function(l){ if (groups.indexOf(l.g)<0) groups.push(l.g); });
  var glines = groups.map(function(gr){ return {g:gr, pts:avgLine(lines.filter(function(l){return l.g===gr;}))}; });
  glines.forEach(function(l){ all = all.concat(l.pts); });
  var shown = mode==="avg" ? avg : all;
  var dts = all.map(function(p){return dnum(p.date);}), x0=Math.min.apply(null,dts), x1=Math.max.apply(null,dts);
  var vs = shown.map(function(p){return p.v;}).concat([0]), mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  var span = (mx-mn)||10; mn -= span*0.12; mx += span*0.18;
  function X(d){ return L+8+(dnum(d)-x0)/((x1-x0)||1)*(W-L-R-8); }
  function Y(v){ return T+(1-(v-mn)/(mx-mn))*(H-T-B); }
  var g = '';
  [mn+(mx-mn)*0.15, mn+(mx-mn)*0.85].filter(function(v){ return Math.abs(v)>(mx-mn)*0.15; }).forEach(function(v){ var y=Y(v); g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+CH.grid+'" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" class="ax">'+fmtPct(v)+'</text>'; });
  g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="'+CH.ink+'" stroke-width="1.5" stroke-dasharray="2 3"/><text x="'+(L-6)+'" y="'+(Y(0)+3.5).toFixed(1)+'" text-anchor="end" class="ax">0%</text>';
  function pl(pts){ return pts.map(function(p){return X(p.date).toFixed(1)+","+Y(p.v).toFixed(1);}).join(" "); }
  var body = '';
  if (mode==="avg"){
    var last = avg[avg.length-1];
    body = '<polygon points="'+X(avg[0].date).toFixed(1)+','+Y(0).toFixed(1)+' '+pl(avg)+' '+X(last.date).toFixed(1)+','+Y(0).toFixed(1)+'" style="fill:var(--area)"/>'+
      '<polyline points="'+pl(avg)+'" fill="none" stroke="'+CH.ink+'" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>'+
      avg.map(function(p){ return '<circle cx="'+X(p.date).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="'+CH.ink+'"/>'; }).join("")+
      '<circle cx="'+X(last.date).toFixed(1)+'" cy="'+Y(last.v).toFixed(1)+'" r="5.5" style="fill:var(--accent)" stroke="'+CH.halo+'" stroke-width="2"/>'+

  } else {
    body = glines.map(function(l){
      var c = gColor(l.g), last = l.pts[l.pts.length-1];

  return '<svg viewBox="0 0 '+W+' '+H+'" class="big" role="img" aria-label="Overall progress">'+g+body+xl+'</svg><div class="legend">'+legend+'</div>';
}

/* ---------- tema chiaro / scuro ---------- */
function curTheme(){ return document.documentElement.getAttribute("data-theme")==="dark" ? "dark" : "light"; }
function applyTheme(t){
  if (t==="dark") document.documentElement.setAttribute("data-theme","dark"); else document.documentElement.removeAttribute("data-theme");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
}

function route(){
  var h = location.hash.replace(/^#\/?/,"").split("/");
  var html;
  chartColors();
  if (h[0]==="g") html = vGroup(h[1]);
  else if (h[0]==="e") html = vEx(h[1]);
  else if (h[0]==="p") html = h[1]==="g" ? vProgGroup(h[2]) : h[1]==="e" ? vProgEx(h[2]) : vProg();
  else if (h[0]==="n") html = vNote();
  else if (h[0]==="s") html = vSettings();
  else html = vHome();
  app.innerHTML = html;
}
function rerender(keepScroll){ var y = window.scrollY; route(); if (keepScroll) window.scrollTo(0,y); }

/* ---------- navigazione: indietro di sistema, gesture, scroll ---------- */
function curHash(){ var h = location.hash; return (!h || h==="#" || h==="#/") ? "#/" : h; }
var STACK = [curHash()], scrollMem = {}, pendingReplace = false;
function go(h, replace){
  if (h===curHash()) return;
  if (replace){ pendingReplace = true; location.replace(location.href.split("#")[0]+h); }
  else location.hash = h;
}
function goBack(target){
  if (STACK.length>1 && STACK[STACK.length-2]===target) history.back();
  else go(target, true);
}
function parentOf(h){
  var p = h.replace(/^#\/?/,"").split("/");
  if (p[0]==="e"){ var f = findEx(p[1]); return f ? "#/g/"+f.g.id : "#/"; }
  if (p[0]==="p" && p[1]==="e"){ var f2 = findEx(p[2]); return f2 ? "#/p/g/"+f2.g.id : "#/p"; }
  if (p[0]==="p" && p[1]==="g") return "#/p";
  if (p[0]==="g" || p[0]==="p" || p[0]==="n" || p[0]==="s") return "#/";
  return null;
}
function backFromHere(){ var t = parentOf(curHash()); if (t) goBack(t); return !!t; }
window.addEventListener("scroll", function(){ scrollMem[curHash()] = window.scrollY; }, {passive:true});
window.addEventListener("hashchange", function(){
  var h = curHash(), back = false;
  if (pendingReplace){ STACK[STACK.length-1] = h; pendingReplace = false; }
  else if (STACK.length>1 && STACK[STACK.length-2]===h){ STACK.pop(); back = true; }
  else STACK.push(h);
  route();
  window.scrollTo(0, back ? (scrollMem[h]||0) : 0);
});
document.addEventListener("click", function(e){
  var a = e.target.closest && e.target.closest("a[data-back],a[data-tab]"); if (!a) return;
  e.preventDefault();
  var h = a.getAttribute("href");
  if (a.hasAttribute("data-back")) return goBack(h);
  var cur = curHash();
  if (h===cur) return;
  if (h==="#/") goBack("#/");
  else if (cur==="#/") go(h);
  else go(h, true);
});
/* gesture "scorri dal bordo sinistro" per l'app installata su iPhone, che non ha il tasto indietro */
(function(){
  if (!window.navigator.standalone) return;
  var ind = document.createElement("div"); ind.className = "swipe-ind"; ind.innerHTML = I.back; document.body.appendChild(ind);
  var sx=0, sy=0, dx=0, on=false;
  document.addEventListener("touchstart", function(e){ var t=e.touches[0]; if (t.clientX<24 && parentOf(curHash())){ on=true; sx=t.clientX; sy=t.clientY; dx=0; } }, {passive:true});
  document.addEventListener("touchmove", function(e){ if (!on) return; var t=e.touches[0]; dx=t.clientX-sx; if (Math.abs(t.clientY-sy)>60){ on=false; ind.style.transform=""; return; }
    var k=Math.max(0,Math.min(dx,110)); ind.style.transform="translate("+(k*0.7-56)+"px,-50%)"; ind.classList.toggle("ready", dx>80); }, {passive:true});
  document.addEventListener("touchend", function(){ if (!on) return; on=false; ind.style.transform=""; ind.classList.remove("ready"); if (dx>80) backFromHere(); }, {passive:true});
})();


function curExId(){ var h = location.hash.split("/"); return h[1]==="e" ? h[2] : null; }
function readDraft(){
  var id = curExId(); if (!id || !draft[id]) return null;
  var kg = document.getElementById("kg"), reps = document.getElementById("reps");
  if (kg){ var v = parseFloat(kg.value.replace(",",".")); if (!isNaN(v)) draft[id].kg = Math.max(0,v); }
  if (reps){ var r = parseInt(reps.value,10); if (!isNaN(r)) draft[id].reps = Math.max(0,r); }
  return draft[id];
}

app.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), d;
  if (act==="theme"){ var th = b.getAttribute("data-v"); try { localStorage.setItem("ghisa-theme", th); } catch(err){} applyTheme(th); rerender(true); }
  else if (act==="pm"){ P.m=b.getAttribute("data-v"); rerender(true); }
  else if (act==="pov"){ P.ov=b.getAttribute("data-v"); rerender(true); }
  else if (act==="pr"){ P.r=b.getAttribute("data-v"); rerender(true); }
  else if (act==="kg" || act==="reps"){ d = readDraft(); var step = parseFloat(b.getAttribute("data-d"));
    if (act==="kg") d.kg = Math.max(0, Math.round((d.kg+step)*100)/100); else d.reps = Math.max(0, d.reps+step);
    rerender(true); }
  else if (act==="sgoal"){ var fx = findEx(id); readDraft(); fx.ex.sets = Math.max(1, Math.min(10, setsGoal(fx.ex)+parseInt(b.getAttribute("data-d"),10))); save(); rerender(true); }
  else if (act==="clean" || act==="scarse"){ d = readDraft(); d.scarse = act==="scarse"; rerender(true); }
  else if (act==="saveLog"){ d = readDraft();
    if (!d.reps){ toast("Add at least one rep"); return; }
    S.logs.push({id:uid(), exId:id, date:today(), kg:d.kg, reps:d.reps, scarse:d.scarse, t:Date.now()}); d.scarse=false; save();
    var fs = findEx(id), nd = S.logs.filter(function(l){return l.exId===id && l.date===today();}).length, gl = setsGoal(fs.ex);
    if (T.auto) timerStart(T.dur); rerender(true);
    toast(nd===gl ? "All "+gl+" sets done!" : "Set "+nd+"/"+gl+" saved"+(T.auto?" · rest started":"")); }
  else if (act==="tset"){ T.dur = +b.getAttribute("data-v"); tSave(); timerStart(T.dur); rerender(true); }
  else if (act==="tpause"){ if (T.running){ T.left = Math.max(0, T.end-Date.now()); T.running=false; releaseWake(); tSave(); } else if (T.left!=null){ timerStart(T.left/1000, true); } rerender(true); }
  else if (act==="tadd"){ if (T.running) T.end += 15000; else if (T.left!=null) T.left += 15000; T.total += 15000; tSave(); tick(); }
  else if (act==="tstop"){ timerStop(); rerender(true); }
  else if (act==="tauto"){ T.auto = !T.auto; tSave(); rerender(true); }
  else if (act==="delLog"){ if (confirm("Delete this set?")){ S.logs = S.logs.filter(function(l){return l.id!==id;}); save(); rerender(true); } }
  else if (act==="newGroup"){ var n = prompt("Group name (e.g. Back)"); if (n && n.trim()){ var g={id:uid(),name:n.trim(),color:COLORS[S.groups.length%COLORS.length],exercises:[]}; S.groups.push(g); save(); location.hash="#/g/"+g.id; } }
  else if (act==="renGroup"){ var g1=findGroup(id), n1=prompt("New name", g1.name); if (n1 && n1.trim()){ g1.name=n1.trim(); save(); rerender(true);} }
  else if (act==="delGroup"){ var g2=findGroup(id); if (confirm("Delete “"+g2.name+"” and all its history?")){ var ids={}; g2.exercises.forEach(function(x){ids[x.id]=1;}); S.logs=S.logs.filter(function(l){return !ids[l.exId];}); S.groups=S.groups.filter(function(x){return x!==g2;}); save(); goBack("#/"); } }
  else if (act==="newEx"){ var n2 = prompt("Exercise name"); if (n2 && n2.trim()){ var ex={id:uid(),name:n2.trim()}; findGroup(id).exercises.push(ex); save(); location.hash="#/e/"+ex.id; } }
  else if (act==="renEx"){ var f=findEx(id), n3=prompt("New name", f.ex.name); if (n3 && n3.trim()){ f.ex.name=n3.trim(); save(); rerender(true);} }
  else if (act==="delEx"){ var f2=findEx(id); if (confirm("Delete “"+f2.ex.name+"” and its history?")){ S.logs=S.logs.filter(function(l){return l.exId!==id;}); f2.g.exercises=f2.g.exercises.filter(function(x){return x.id!==id;}); save(); goBack("#/g/"+f2.g.id); } }
  else if (act==="doImport"){ var p=parseNote(noteText); if (!p.length) return; applyImport(S, p, noteDate); save(); noteText=""; toast("Imported"); goBack("#/"); }
  else if (act==="export"){ var blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ghisa-backup-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove(); }
  else if (act==="restore"){ document.getElementById("file").click(); }
  else if (act==="reset"){ if (confirm("Delete all groups, exercises and history?")){ S=empty(); save(); go("#/", true); route(); } }
});
app.addEventListener("input", function(e){
